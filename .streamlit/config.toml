# Tema del tablero (dashboard/app.py). Streamlit lee este archivo desde la carpeta donde se ejecuta
# `streamlit run`, por eso está en la raíz del repo. Los secretos NO van aquí (secrets.toml está en .gitignore).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
